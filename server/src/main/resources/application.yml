geomap:
  signing:
    private-key-pem: ${GEOMAP_SIGNING_PRIVATE_KEY_PEM:}
    public-key-pem: ${GEOMAP_SIGNING_PUBLIC_KEY_PEM:}
spring:
  application:
    name: geomap-server
  mvc:
    problemdetails:
      # Framework-raised errors (malformed JSON, bad path ids) also answer with RFC 9457 bodies.
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
